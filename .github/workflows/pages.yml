name: Publier sur GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Versionner le cache de l'application
        run: sed -i "s/^const VERSION = .*/const VERSION = \"${GITHUB_SHA}\";/" site/sw.js
      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
